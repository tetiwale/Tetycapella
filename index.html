<!-- Contact Section -->
<section id="contact" class="py-16 relative">
    <div class="max-w-xl mx-auto px-6 text-center">
        <span class="text-pink-400 font-bold uppercase tracking-wider text-xs bg-pink-500/10 px-3 py-1 rounded-full border border-pink-500/20">
            Get In Touch
        </span>
        <h2 class="text-3xl md:text-4xl font-extrabold mt-3 mb-4 text-white">
            Contact Us
        </h2>
        <p class="text-slate-400 text-sm mb-8">
            Are you an artist or looking to collaborate? Send a message directly to get in touch with us!
        </p>

        <!-- Functional Form (Uses Formspree for reliable delivery) -->
        <form action="https://formspree.io/f/YOUR_FORMSPREE_ID" method="POST" class="bg-slate-900/80 p-6 md:p-8 rounded-2xl border border-slate-800 text-left flex flex-col gap-4 shadow-xl">
            <div>
                <label for="name" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Your Name</label>
                <input type="text" id="name" name="name" required placeholder="Enter your name" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-100 placeholder-slate-600 focus:outline-none focus:border-pink-500 transition">
            </div>
            <div>
                <label for="email" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Your Email</label>
                <input type="email" id="email" name="email" required placeholder="Enter your email address" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-100 placeholder-slate-600 focus:outline-none focus:border-pink-500 transition">
            </div>
            <div>
                <label for="phone" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Phone Number</label>
                <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-100 placeholder-slate-600 focus:outline-none focus:border-pink-500 transition">
            </div>
            <div>
                <label for="message" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Message</label>
                <textarea id="message" name="message" rows="4" required placeholder="Write your message here..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-100 placeholder-slate-600 focus:outline-none focus:border-pink-500 transition resize-none"></textarea>
            </div>
            <button type="submit" class="w-full bg-gradient-to-r from-pink-500 to-purple-600 hover:from-pink-600 hover:to-purple-700 text-white font-bold py-3.5 px-6 rounded-xl transition duration-300 shadow-lg shadow-pink-500/20">
                Send Message
            </button>
        </form>

        <div class="mt-6 flex flex-col sm:flex-row items-center justify-center gap-4 text-slate-400 text-xs">
            <div>
                <span>Email directly: </span>
                <a href="mailto:jacksonotieno875@gmail.com" class="text-pink-400 hover:underline font-semibold">jacksonotieno875@gmail.com</a>
            </div>
            <span class="hidden sm:inline">•</span>
            <div>
                <span>Call/WhatsApp: </span>
                <a href="https://wa.me/254797206482" target="_blank" class="text-emerald-400 hover:underline font-semibold">+254 797 206 482</a>
            </div>
        </div>
    </div>
</section>
